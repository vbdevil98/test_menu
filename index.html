<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATTVA Bar & Cafe | AI Interactive Menu</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            brand: { 50: '#f8faf9', 100: '#eef2f0', 800: '#2c4238', 900: '#1a2e25' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f8faf9; -webkit-tap-highlight-color: transparent; }
    
    /* Smooth Scrollbar for filters */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Animations */
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    .animate-shimmer {
      animation: shimmer 2s infinite linear;
      background: linear-gradient(to right, #e5e7eb 4%, #f3f4f6 25%, #e5e7eb 36%);
      background-size: 1000px 100%;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="text-gray-800 antialiased pb-20">

  <!-- Hero Header -->
  <header class="relative h-[40vh] min-h-[300px] w-full">
    <img src="https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1920&q=80" alt="TATTVA Interior" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-brand-900 via-brand-900/50 to-transparent flex flex-col justify-end p-8 md:p-12 lg:px-24">
      <div class="max-w-6xl mx-auto w-full">
        <div class="flex items-center gap-4 mb-3">
          <div class="w-14 h-14 rounded-full border border-amber-200/40 flex items-center justify-center bg-black/20 backdrop-blur-sm">
            <span class="text-amber-200 text-2xl font-serif">T</span>
          </div>
          <div>
            <h1 class="text-4xl md:text-5xl font-serif text-white tracking-wide">TATTVA</h1>
            <p class="text-amber-200/80 text-sm tracking-[0.25em] uppercase mt-1">Bar & Cafe</p>
          </div>
        </div>
        <p class="text-white/80 text-base font-light max-w-md">Experience our curated menu. Tap any dish for real-time AI tasting notes, pairings, and nutritional profiles.</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 md:px-8 -mt-8 relative z-10">
    <!-- Category Filters -->
    <div class="bg-white rounded-2xl shadow-lg p-2 mb-8 flex gap-2 overflow-x-auto no-scrollbar border border-gray-100 sticky top-4 z-20">
      <button onclick="filterMenu('All')" id="btn-All" class="filter-btn active-filter px-6 py-2.5 rounded-xl text-sm font-semibold transition-all bg-brand-900 text-white whitespace-nowrap">All Menu</button>
      <button onclick="filterMenu('Pizza')" id="btn-Pizza" class="filter-btn px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-brand-50 transition-all whitespace-nowrap">Pizza</button>
      <button onclick="filterMenu('Pasta')" id="btn-Pasta" class="filter-btn px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-brand-50 transition-all whitespace-nowrap">Pasta</button>
      <button onclick="filterMenu('Sushi & Dimsum')" id="btn-Sushi & Dimsum" class="filter-btn px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-brand-50 transition-all whitespace-nowrap">Sushi & Dimsum</button>
      <button onclick="filterMenu('Soup & Salad')" id="btn-Soup & Salad" class="filter-btn px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-brand-50 transition-all whitespace-nowrap">Soup & Salad</button>
    </div>

    <!-- Menu Grid -->
    <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- JavaScript injects cards here -->
    </div>
  </main>

  <!-- AI Detail Modal -->
  <div id="ai-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 bg-brand-900/60 backdrop-blur-md transition-opacity">
    <div class="bg-white w-full max-w-lg rounded-[2rem] overflow-hidden shadow-2xl animate-slide-up relative flex flex-col max-h-[90vh]">
      
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/40 hover:bg-black/60 backdrop-blur-md text-white w-9 h-9 flex items-center justify-center rounded-full z-20 transition text-lg">✕</button>
      
      <div class="relative h-64 sm:h-72 shrink-0">
        <img id="modal-image" src="" alt="" class="w-full h-full object-cover">
        <div class="absolute bottom-0 inset-x-0 h-24 bg-gradient-to-t from-white to-transparent"></div>
      </div>
      
      <div class="p-6 sm:p-8 overflow-y-auto -mt-6 relative z-10 bg-white rounded-t-3xl">
        <div class="flex justify-between items-start mb-3 gap-4">
          <h2 id="modal-title" class="text-2xl sm:text-3xl font-serif font-bold text-brand-900 leading-tight"></h2>
        </div>
        <p id="modal-ingredients" class="text-sm text-gray-500 leading-relaxed font-medium mb-6"></p>

        <!-- Loading State -->
        <div id="loading-state" class="hidden space-y-4 border-t border-gray-100 pt-6">
          <div class="flex items-center gap-3">
            <div class="w-5 h-5 rounded-full border-[3px] border-amber-500 border-t-transparent animate-spin"></div>
            <span class="text-xs font-bold text-amber-600 uppercase tracking-widest">Groq AI Analyzing...</span>
          </div>
          <div class="h-20 rounded-2xl animate-shimmer w-full"></div>
          <div class="flex gap-4">
            <div class="h-16 rounded-2xl animate-shimmer w-1/2"></div>
            <div class="h-16 rounded-2xl animate-shimmer w-1/2"></div>
          </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden mt-4 p-4 bg-red-50 text-red-700 rounded-2xl text-sm font-medium border border-red-100"></div>

        <!-- AI Results -->
        <div id="ai-results" class="hidden border-t border-gray-100 pt-6 space-y-5 animate-fade-in">
          <div class="bg-gradient-to-br from-amber-50 to-orange-50 p-5 rounded-2xl border border-amber-100/60">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-amber-700 text-lg">✨</span>
              <span class="text-xs font-bold uppercase tracking-wider text-amber-800">Tasting Notes</span>
            </div>
            <p id="ai-description" class="text-[15px] text-gray-800 leading-relaxed font-medium"></p>
          </div>
          
          <div class="flex gap-4">
            <div class="flex-1 bg-brand-50 p-4 rounded-2xl border border-brand-100 text-center">
              <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Est. Calories</div>
              <div id="ai-calories" class="text-xl font-black text-brand-900"></div>
            </div>
            <div class="flex-1 bg-brand-50 p-4 rounded-2xl border border-brand-100 text-center">
              <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">Protein</div>
              <div id="ai-protein" class="text-xl font-black text-emerald-600"></div>
            </div>
          </div>

          <div class="flex items-center gap-4 text-sm text-gray-700 bg-gray-50 p-4 rounded-2xl border border-gray-200">
            <span class="text-2xl">🍷</span> 
            <span class="leading-snug"><strong class="text-brand-900 block mb-0.5">Perfect Pairing</strong> <span id="ai-pairing"></span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const GROQ_API_KEY = "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"; // PASTE YOUR KEY HERE
    
    const getImg = (prompt, seed) => `https://image.pollinations.ai/prompt/${encodeURIComponent('Commercial food photography of ' + prompt + ', fine dining presentation, dramatic lighting, high contrast, photorealistic, 8k')}?seed=${seed}&width=800&height=600&nologo=true`;

    // Veg/Non-Veg SVG Icons
    const vegIcon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="14" height="14" stroke="#166534" stroke-width="2"/><circle cx="8" cy="8" r="4" fill="#166534"/></svg>`;
    const nonVegIcon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="14" height="14" stroke="#991B1B" stroke-width="2"/><polygon points="8,4 12,11 4,11" fill="#991B1B"/></svg>`;

    const MENU_ITEMS = [
      { id: 1, name: 'The Viral Double Burrata Pizza', price: '₹800', category: 'Pizza', isVeg: false, image: getImg('wood-fired pizza topped with two whole spheres of burrata cheese, chicken mornay sauce and basil oil', 201), ingredients: 'Burrata Cheese, Mornay sauce with chicken, Margherita, Basil Oil Drizzle, topped with Salad - Lemon Vinaigrette.' },
      { id: 2, name: 'Mushroom & Truffle Pizza', price: '₹690', category: 'Pizza', isVeg: true, image: getImg('wood-fired pizza with shiitake mushrooms, cream cheese, and truffle oil drizzle', 202), ingredients: 'Sauté farm mushroom shitake, cream cheese, mushroom pate, drizzle with truffle oil.' },
      { id: 3, name: 'Greek Art Pizza', price: '₹675', category: 'Pizza', isVeg: true, image: getImg('pizza with artichokes, spinach, roasted garlic, sundried tomatoes, and feta cheese', 203), ingredients: 'Artichokes sauté spinach roasted garlic sundried tomatoes feta cheese.' },
      { id: 4, name: 'Pumpkin Risotto', price: '₹620', category: 'Pasta', isVeg: true, image: getImg('creamy yellow-orange pumpkin risotto in a matte bowl garnished with parmesan', 204), ingredients: 'Creamy Arborio rice infused with the warmth of roasted pumpkin, onions, and garlic, finished with a hint of nutmeg and Parmesan cheese.' },
      { id: 5, name: 'Pesto Chicken Pasta', price: '₹740', category: 'Pasta', isVeg: false, image: getImg('steaming linguine pasta coated in green basil pesto topped with grilled chicken breast', 205), ingredients: 'Tender grilled chicken, tossed with freshly made basil pesto, garlic, and linguine pasta, finished with grated Parmesan cheese.' },
      { id: 6, name: 'Spaghetti Puttanesca', price: '₹620', category: 'Pasta', isVeg: true, image: getImg('spaghetti pasta in rich red tomato sauce with olives and capers', 206), ingredients: 'Classic Italian pasta dish with tomatoes, olive oil, olives, capers, and garlic.' },
      { id: 7, name: 'Mexican Tomato Bean Soup', price: '₹430', category: 'Soup & Salad', isVeg: true, image: getImg('rich red tomato bean soup in a ceramic bowl with tortilla strips', 207), ingredients: 'With tortilla & coriander.' },
      { id: 8, name: 'Burrata Citrus Salad', price: '₹585', category: 'Soup & Salad', isVeg: true, image: getImg('fresh salad with a whole burrata cheese, lettuce, and orange segments', 208), ingredients: 'Burrata cheese lettuce with orange juice balsamic vinegar.' },
      { id: 9, name: 'Chicken Avocado Salad', price: '₹470', category: 'Soup & Salad', isVeg: false, image: getImg('healthy salad bowl with chicken, avocado, cherry tomatoes, and olives', 209), ingredients: 'Lettuce tossed with mushrooms, cherry tomatoes, olives, chicken & date mayo dressing.' },
      { id: 10, name: 'Avocado & Cream Cheese Roll', price: '₹575', category: 'Sushi & Dimsum', isVeg: true, image: getImg('uramaki sushi roll filled with avocado and cream cheese on a black slate', 210), ingredients: 'Avocado and philadelphia cream cheese wrapped in nori sheet and sticky rice, served with wasabi, kikkoman soy and pickled ginger.' },
      { id: 11, name: 'Philadelphia Salmon Roll', price: '₹675', category: 'Sushi & Dimsum', isVeg: false, image: getImg('sushi roll with fresh raw salmon and cream cheese filling', 211), ingredients: 'A choicest selection of salmon, avocado on cream cheese wrapped in nori sheet and sushi rice.' },
      { id: 12, name: 'Spicy Tuna Roll', price: '₹645', category: 'Sushi & Dimsum', isVeg: false, image: getImg('sushi roll topped with sliced raw tuna and spicy mayo drizzle', 212), ingredients: 'Sushi rice, tuna, avocado, cucumber wrapped in nori sheet topped with sliced tuna and avocado drizzle with spicy mayo.' },
      { id: 13, name: 'Edamame Truffle Dumpling', price: '₹545', category: 'Sushi & Dimsum', isVeg: true, image: getImg('translucent steamed dumplings filled with green edamame served in a bamboo basket', 213), ingredients: 'A transparent dough dumpling with edamame, water chestnuts, truffle oil.' }
    ];

    // ==========================================
    // 2. RENDERING LOGIC
    // ==========================================
    const container = document.getElementById('menu-container');
    
    function filterMenu(category) {
      // Update Button Styles
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-brand-900', 'text-white', 'active-filter');
        btn.classList.add('text-gray-500', 'hover:bg-brand-50');
      });
      const activeBtn = document.getElementById(`btn-${category}`);
      activeBtn.classList.add('bg-brand-900', 'text-white', 'active-filter');
      activeBtn.classList.remove('text-gray-500', 'hover:bg-brand-50');

      // Filter and Render
      const filtered = category === 'All' ? MENU_ITEMS : MENU_ITEMS.filter(item => item.category === category);
      container.innerHTML = '';
      
      filtered.forEach(dish => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex flex-col cursor-pointer hover:shadow-lg transition-all duration-300 group";
        card.onclick = () => openModal(dish);
        
        card.innerHTML = `
          <div class="relative h-56 w-full bg-gray-100 overflow-hidden">
            <img src="${dish.image}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${dish.name}">
            <div class="absolute top-4 left-4 glass-panel px-3 py-1.5 rounded-full text-[10px] font-bold text-brand-900 uppercase tracking-widest shadow-sm">
              ${dish.category}
            </div>
            <div class="absolute top-4 right-4 bg-white p-1.5 rounded shadow-sm">
              ${dish.isVeg ? vegIcon : nonVegIcon}
            </div>
          </div>
          <div class="p-6 flex flex-col flex-1 justify-between">
            <div>
              <div class="flex justify-between items-start gap-4 mb-2">
                <h2 class="font-serif font-bold text-xl text-brand-900 leading-tight">${dish.name}</h2>
              </div>
              <p class="text-sm text-gray-500 line-clamp-2 leading-relaxed font-sans mb-4">${dish.ingredients}</p>
            </div>
            <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
              <span class="font-bold text-lg text-brand-900">${dish.price}</span>
              <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-3 py-1 rounded-full group-hover:bg-amber-100 transition-colors">AI Analysis →</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Initialize
    filterMenu('All');

    // ==========================================
    // 3. AI MODAL LOGIC
    // ==========================================
    const modal = document.getElementById('ai-modal');
    
    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function openModal(dish) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      document.getElementById('modal-image').src = dish.image;
      document.getElementById('modal-title').innerHTML = `${dish.name} <span class="inline-block ml-2 align-middle">${dish.isVeg ? vegIcon : nonVegIcon}</span>`;
      document.getElementById('modal-ingredients').innerText = dish.ingredients;
      
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('ai-results').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');

      try {
        if (GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE" || !GROQ_API_KEY) {
            throw new Error("Missing API Key. Please add your Groq API key to the code.");
        }

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama3-8b-8192", 
            messages: [
              {
                role: "system",
                content: `You are an expert culinary director and nutritionist. Respond ONLY with a valid JSON object matching this structure:
                {
                  "description": "Sensory, vivid 20-word description of flavor profile",
                  "calories": "e.g., 450 kcal",
                  "protein": "e.g., 24g",
                  "pairing": "One specific premium beverage or wine pairing"
                }`
              },
              { role: "user", content: `Dish: ${dish.name}\nIngredients: ${dish.ingredients}` }
            ],
            response_format: { type: "json_object" },
            temperature: 0.3
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiData = JSON.parse(data.choices[0].message.content);
        
        document.getElementById('ai-description').innerText = aiData.description;
        document.getElementById('ai-calories').innerText = aiData.calories;
        document.getElementById('ai-protein').innerText = aiData.protein;
        document.getElementById('ai-pairing').innerText = aiData.pairing;

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('ai-results').classList.remove('hidden');

      } catch (error) {
        console.error("AI Error:", error);
        document.getElementById('loading-state').classList.add('hidden');
        const errDiv = document.getElementById('error-state');
        errDiv.innerText = error.message;
        errDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
