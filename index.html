<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattva | Digital Menu</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a modern, Gen-Z look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Gen-Z Trending Glassmorphism & Animations */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }
        .modal-glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Loading Animation for AI */
        .ai-pulse {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        /* Hidden state for modals */
        .hidden-modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .active-modal {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-10">

    <!-- Header -->
    <header class="text-center pt-12 pb-8 px-4">
        <h1 class="text-5xl font-bold tracking-tight mb-2">TATTVA</h1>
        <p class="text-slate-400 text-lg">Curated. Conscious. Crafted.</p>
    </header>

    <!-- Menu Container -->
    <main class="max-w-md mx-auto px-4 grid gap-6" id="menu-container">
        <!-- Menu Items Injected via JS -->
    </main>

    <!-- AI Detail Modal -->
    <div id="item-modal" class="fixed inset-0 z-50 hidden-modal flex items-end justify-center sm:items-center modal-glass">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 relative shadow-2xl transform transition-transform translate-y-full sm:translate-y-0" id="modal-content" style="transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
            
            <!-- Close Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-800 text-slate-300 rounded-full p-2 hover:bg-slate-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Image Container (Loads only on click) -->
            <div id="modal-image-container" class="w-full h-48 rounded-xl overflow-hidden mb-4 bg-slate-800 hidden flex items-center justify-center">
                <img id="modal-image" src="" alt="Dish Image" class="w-full h-full object-cover hidden">
                <span id="image-loader" class="text-slate-400 text-sm ai-pulse">Loading visual...</span>
            </div>

            <h2 id="modal-title" class="text-2xl font-bold mb-2">Dish Name</h2>
            <div class="flex gap-2 mb-4 flex-wrap" id="modal-tags">
                <!-- Tags like High Protein injected here -->
            </div>

            <!-- AI Summary Section -->
            <div class="bg-slate-800/50 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center gap-2 mb-2">
                    <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="text-xs font-bold text-sky-400 uppercase tracking-wider">AI Sommelier & Nutritionist</span>
                </div>
                <p id="modal-ai-text" class="text-sm text-slate-300 leading-relaxed min-h-[4rem]">
                    <!-- AI text streams here -->
                </p>
            </div>
            
            <button onclick="closeModal()" class="w-full mt-6 bg-gradient-to-r from-sky-500 to-indigo-500 text-white font-bold py-3 rounded-xl hover:opacity-90 transition">
                Add to Order
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // IMPORTANT: Replace this with your actual Groq API Key for testing.
        const GROQ_API_KEY = "YOUR_GROQ_API_KEY_HERE"; 
        
        // Menu Database
        const menuData = [
            {
                id: 1,
                name: "Grilled Paneer Power Bowl",
                price: "₹350",
                description: "Spiced grilled paneer served over a bed of quinoa, topped with roasted oats crunch, chia seeds, and fresh greens.",
                tags: ["High Protein", "Vegetarian", "Keto-Friendly"],
                image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 2,
                name: "Citrus Espresso Fizz",
                price: "₹220",
                description: "A refreshing kick of cold-brewed coffee mixed with ginger ale, a splash of lemon, and sparkling soda water.",
                tags: ["Energizing", "Vegan", "Cold"],
                image: "https://images.unsplash.com/photo-1579992357154-faf4bde95b3d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 3,
                name: "Lean Chicken Tikka Wrap",
                price: "₹280",
                description: "Charcoal-grilled chicken breast wrapped in a whole wheat roti with mint yogurt.",
                tags: ["High Protein", "Low Carb"],
                image: "https://images.unsplash.com/photo-1626779844498-8e6d2bc60c23?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            }
        ];

        // ==========================================
        // UI RENDERING
        // ==========================================
        const menuContainer = document.getElementById('menu-container');

        // Render Menu Cards
        menuData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'glass-card p-5 cursor-pointer';
            card.onclick = () => openItem(item.id);
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-xl font-bold">${item.name}</h3>
                    <span class="text-sky-400 font-semibold">${item.price}</span>
                </div>
                <p class="text-slate-400 text-sm line-clamp-2">${item.description}</p>
                <div class="mt-3 flex gap-2">
                    ${item.tags.map(tag => `<span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded-md border border-slate-700">${tag}</span>`).join('')}
                </div>
            `;
            menuContainer.appendChild(card);
        });

        // ==========================================
        // MODAL & AI LOGIC
        // ==========================================
        const modal = document.getElementById('item-modal');
        const modalContent = document.getElementById('modal-content');

        async function openItem(id) {
            const item = menuData.find(i => i.id === id);
            
            // Set basic info
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-tags').innerHTML = item.tags.map(tag => `<span class="text-xs bg-indigo-900 text-indigo-200 px-2 py-1 rounded-md">${tag}</span>`).join('');
            
            // Handle Image loading (lazy load on click)
            const imgContainer = document.getElementById('modal-image-container');
            const imgEl = document.getElementById('modal-image');
            const imgLoader = document.getElementById('image-loader');
            
            imgContainer.classList.remove('hidden');
            imgEl.classList.add('hidden');
            imgLoader.classList.remove('hidden');
            
            imgEl.src = item.image;
            imgEl.onload = () => {
                imgLoader.classList.add('hidden');
                imgEl.classList.remove('hidden');
            };

            // Reset AI Text
            document.getElementById('modal-ai-text').innerHTML = '<span class="ai-pulse">Analyzing nutritional profile & pairings...</span>';
            
            // Open Modal with animation
            modal.classList.remove('hidden-modal');
            modal.classList.add('active-modal');
            setTimeout(() => {
                modalContent.style.transform = 'translateY(0)';
            }, 10);

            // Call Groq AI
            await generateAISummary(item);
        }

        function closeModal() {
            modalContent.style.transform = window.innerWidth < 640 ? 'translateY(100%)' : 'scale(0.95)';
            setTimeout(() => {
                modal.classList.remove('active-modal');
                modal.classList.add('hidden-modal');
                document.getElementById('modal-image-container').classList.add('hidden');
            }, 300);
        }

        async function generateAISummary(item) {
            if (GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE") {
                document.getElementById('modal-ai-text').innerText = "⚠️ Please add your Groq API Key in the code to see live AI summaries.";
                return;
            }

            const prompt = `You are a trendy Gen-Z food sommelier. Write a 2-sentence pitch for this dish: "${item.name}" (Description: ${item.description}). Sentence 1: Highlight its vibe and dietary benefits (like High Protein or energy). Sentence 2: Suggest a pairing from a standard menu to upsell the customer. Keep it punchy, appetizing, and use one relevant emoji.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", // Fast, lightweight model perfect for quick text
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7,
                        max_tokens: 100
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const aiText = data.choices[0].message.content;
                    
                    // Typewriter effect for the AI text
                    const aiContainer = document.getElementById('modal-ai-text');
                    aiContainer.innerHTML = '';
                    let i = 0;
                    const typeWriter = setInterval(() => {
                        if (i < aiText.length) {
                            aiContainer.innerHTML += aiText.charAt(i);
                            i++;
                        } else {
                            clearInterval(typeWriter);
                        }
                    }, 20); // Speed of typing effect
                } else {
                    document.getElementById('modal-ai-text').innerText = "AI is taking a coffee break. Please try again later.";
                }
            } catch (error) {
                console.error("Groq API Error:", error);
                document.getElementById('modal-ai-text').innerText = "Unable to connect to AI Sommelier right now.";
            }
        }
    </script>
</body>
</html>
